 {bg:"bg_campus.jpg",expr:"expr_cold.jpg",chapter:"PROLOGUE · 初次见面",
  narration:"九月的风从教学楼之间穿过去。\n你拎着刚领到的校园卡，站在一张怎么看都看不懂的地图前。城市很大，而这所学校更大。",
  who:"",line:"九月的风从教学楼之间穿过去。\n你忽然听见身后有人说话。",choices:[["转身",1]]},
 {bg:"bg_campus.jpg",expr:"expr_cold.jpg",chapter:"PROLOGUE · 初次见面",

 {bg:"bg_campus.jpg",expr:"expr_calm.jpg",chapter:"PROLOGUE · 初次见面",

function closeOverlays(){document.querySelectorAll(".overlay").forEach(x=>x.classList.add("hidden"))}
function openName(){closeOverlays();document.getElementById("nameOverlay").classList.remove("hidden");setTimeout(()=>document.getElementById("nameInput").focus(),30)}
function confirmName(){
 const v=document.getElementById("nameInput").value.trim(); if(!v)return;
 game.name=v;game.run=(game.run||0)+1;game.scene=0;game.loadCount=0;game.playCount=0;closeOverlays();render();
}
function newRun(){openName()}
function openSave(){closeOverlays();renderSlots("saveSlots",false);document.getElementById("saveOverlay").classList.remove("hidden")}
function openLoad(){closeOverlays();renderSlots("loadSlots",true);document.getElementById("loadOverlay").classList.remove("hidden")}
function renderSlots(id,isLoad){
 const el=document.getElementById(id);el.innerHTML="";const slots=getSlots();
 for(let i=0;i<MAX;i++){
  const d=slots[i];const wrap=document.createElement("div");wrap.className="slot"+(!d?" empty":"");
  const thumb=document.createElement("img");thumb.className="thumb";thumb.src=d?(d.chapter.includes("放学")?"bg_city.jpg":d.chapter.includes("END")?"bg_room.jpg":"bg_campus.jpg"):"bg_room.jpg";
  const info=document.createElement("div");
  info.innerHTML=`<strong>存档 ${String(i+1).padStart(2,"0")}</strong>${d?`<small>${d.chapter}<br>周目 ${d.run} · ${d.time}<br>${d.note}</small>`:`<small>空存档位</small>`}`;
  const actions=document.createElement("div");
  if(isLoad && d){const b=document.createElement("button");b.textContent="读取";b.onclick=()=>loadSlot(i);actions.appendChild(b)}
  if(!isLoad){const b=document.createElement("button");b.textContent=d?"覆盖":"保存";b.onclick=()=>saveSlot(i);actions.appendChild(b)}
  wrap.append(thumb,info,actions);el.appendChild(wrap);
 }
}
function saveSlot(i){const slots=getSlots();slots[i]=slotData();setSlots(slots);renderSlots("saveSlots",false)}
function loadSlot(i){
 const d=getSlots()[i];if(!d)return;
 game={...game,...d,loadCount:(d.loadCount||0)+1};closeOverlays();render();
}
window.addEventListener("keydown",e=>{if(e.key==="Enter"&&!document.getElementById("nameOverlay").classList.contains("hidden"))confirmName()});
openName();
