<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《SAVE》Demo 0.4 · 纯文字版</title>
<style>
:root{
  --bg:#0b0e13; --ink:#e9edf2; --muted:#7f8997; --muted2:#9aa4b0;
  --line:rgba(255,255,255,.12); --soft:rgba(255,255,255,.05);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* ===== 舞台 ===== */
#stage{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(160deg,var(--m0,#0b0e13),var(--m1,#0f141a));
  transition:background 1s ease}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.5) 100%)}
/* mood 配色 */
.mood-rain{--m0:#0b1119;--m1:#16202e;--accent:#8fb6d0}
.mood-night{--m0:#0b0d12;--m1:#1a120c;--accent:#d0b48a}
.mood-store{--m0:#0f1419;--m1:#151b21;--accent:#aebccb}
.mood-glitch{--m0:#0a0d12;--m1:#160f1a;--accent:#e08a8a}
.mood-warmrain{--m0:#0d1115;--m1:#1b150f;--accent:#d0a96a}
.mood-autumn{--m0:#100e0a;--m1:#1e1610;--accent:#d8a35c}
.mood-frost{--m0:#0e1116;--m1:#1a2029;--accent:#a8c0d4}
.mood-snow{--m0:#0d1015;--m1:#161c26;--accent:#cfd8e4}
/* rain 纹理 */
.mood-rain::before{opacity:.22;
  background-image:linear-gradient(105deg,transparent 44%,rgba(160,200,230,.22) 50%,transparent 56%);
  background-size:10px 16px;animation:rain 1.3s linear infinite}
/* warmrain 纹理(夏夜暖雨) */
.mood-warmrain::before{opacity:.18;
  background-image:linear-gradient(105deg,transparent 44%,rgba(208,176,138,.18) 50%,transparent 56%);
  background-size:10px 16px;animation:rain 1.3s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-46px 130px}}
/* glitch 扫描线 */
.mood-glitch::before{opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}

/* ===== 顶栏 ===== */
.top{position:relative;z-index:2;height:58px;flex:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:12px;letter-spacing:.28em}
.top .logo{color:#fff;font-weight:600;letter-spacing:.4em}
.topright{display:flex;align-items:center;gap:16px}
.aff{display:flex;gap:10px;font-size:11px;letter-spacing:.06em}
.aff span{color:#7f8997;opacity:.35;transition:opacity .5s,color .5s,text-shadow .5s}
.aff span.on{text-shadow:0 0 12px currentColor}
.top .run{letter-spacing:.14em}

/* ===== 场景区 ===== */
.scene{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:0 clamp(20px,6vw,72px)}
.chapter{margin:26px 0 0;color:var(--accent);font-size:12px;letter-spacing:.22em;min-height:1.2em}
.narration{flex:1;display:flex;align-items:flex-start;justify-content:center;
  max-width:720px;margin:44px auto 0;width:100%;text-align:left;
  font-family:var(--serif);font-size:clamp(16px,1.9vw,19px);line-height:2.15;color:#d7dbe1;
  white-space:pre-wrap;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.narration .reveal{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 立绘(半身) ===== */
.character{position:absolute;z-index:2;left:50%;bottom:300px;transform:translateX(-50%);
  height:min(46vh,420px);max-width:min(46vh,80vw);object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 16px 40px rgba(0,0,0,.5));transition:opacity .45s ease,transform .45s ease;
  pointer-events:none}
.character.hidden{opacity:0;transform:translateX(-50%) translateY(10px)}

/* ===== 对话框 ===== */
.dialog{flex:none;max-width:760px;width:100%;margin:0 auto 26px;position:relative;z-index:3;
  background:linear-gradient(180deg,rgba(10,14,20,.82),rgba(8,11,16,.92));
  border:1px solid var(--line);border-radius:16px;padding:20px 24px 16px;
  box-shadow:0 22px 60px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
.who{font-size:13px;letter-spacing:.14em;color:var(--accent);margin-bottom:9px;min-height:1.2em}
.who.self{color:#d9c9a8}
.line{font-size:clamp(17px,2vw,19px);line-height:1.9;white-space:pre-wrap;min-height:60px;color:#eef1f5}
.line.typing::after{content:"▍";opacity:.7;animation:blink 1s steps(2) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.choices{display:grid;gap:9px;margin-top:14px}
.choice,.continue{border:1px solid var(--line);background:var(--soft);color:#e7ebf0;border-radius:11px;
  padding:12px 16px;text-align:left;cursor:pointer;transition:.18s;font-size:15px;line-height:1.6}
.choice:hover,.continue:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.choice::before{content:"›";color:var(--accent);margin-right:10px}
.continue{text-align:center;color:var(--muted2)}
.continue::after{content:"▸";margin-left:8px}
.controls{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px}
.btn{border:1px solid var(--line);background:transparent;color:var(--muted2);border-radius:8px;
  padding:7px 12px;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:.15s}
.btn:hover{background:var(--soft);color:#e7ebf0}

/* ===== 标题屏 ===== */
#titleScreen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;background:linear-gradient(160deg,#0b0d12,#17100d);padding:24px}
#titleScreen .big{font-size:clamp(54px,11vw,104px);letter-spacing:.42em;font-weight:300;color:#f2f4f7}
#titleScreen .sub{margin-top:22px;color:var(--muted);font-size:15px;letter-spacing:.2em;line-height:2}
#titleScreen .hint{margin-top:10px;color:#6b7480;font-size:12px;letter-spacing:.12em}
.title-actions{display:flex;gap:12px;margin-top:44px}
.title-actions .btn{font-size:14px;padding:11px 26px;letter-spacing:.2em}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:20}
.overlay.hidden{display:none}
.modal{width:min(860px,100%);max-height:90vh;overflow:auto;background:#0c1118f2;border:1px solid var(--line);
  border-radius:16px;box-shadow:0 30px 100px #000;padding:22px}
.modalhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px}
.modal h2{font-weight:500;margin:0;font-size:18px;letter-spacing:.06em}
.muted{color:#8f99a5;font-size:12px;line-height:1.7;margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:11px;padding:11px;
  display:grid;grid-template-columns:74px 1fr auto;gap:11px;align-items:center}
.thumb{width:74px;height:48px;border-radius:7px}
.slot strong{font-size:13px}
.slot small{display:block;color:#929ba7;line-height:1.65;font-size:10px}
.slot button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e6e9ed;
  border-radius:7px;padding:7px 10px;font-size:11px;cursor:pointer}
.slot button:hover{background:rgba(255,255,255,.14)}
.empty{opacity:.5}
.namebox{width:min(430px,100%)}
.namebox input{width:100%;margin-top:12px;background:#070a0e;border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:9px;padding:13px;outline:none;font-size:15px}
.name-actions{display:flex;justify-content:flex-end;margin-top:14px}
.primary{background:#e7eaee!important;color:#11151b!important;border-color:#e7eaee!important}

/* ===== 历史记录 ===== */
.historybox{width:min(720px,100%)}
.histlist{max-height:64vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
.hist-ch{color:var(--accent);font-size:11px;letter-spacing:.18em;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.hist-ch:first-child{margin-top:0;padding-top:0;border-top:0}
.hist-item{display:flex;flex-direction:column;gap:2px}
.hist-nar{color:#9aa4b0;font-size:13px;line-height:1.7;white-space:pre-wrap}
.hist-who{font-size:12px;letter-spacing:.12em;color:var(--accent);margin-top:6px}
.hist-who.self{color:#d9c9a8}
.hist-line{color:#e7ebf0;font-size:14px;line-height:1.75;white-space:pre-wrap}

@media(max-width:640px){
  .top{padding:0 16px}.scene{padding:0 14px}.chapter{margin-top:18px}
  .dialog{margin:0 6px 14px;padding:16px 16px 13px}
  .narration{font-size:16px}
  .character{bottom:260px;height:34vh;max-width:70vw}
  .slots{grid-template-columns:1fr}
  .slot{grid-template-columns:64px 1fr}.thumb{width:64px;height:42px}
  .slot>div:last-child{grid-column:2}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="stage" class="mood-night">
  <header class="top"><div class="logo">S A V E</div><div class="topright"><div class="aff" id="aff"></div><div class="run" id="run"></div></div></header>
  <main class="scene">
    <div class="chapter" id="chapter"></div>
    <img class="character hidden" id="character" alt="沈砚">
    <div class="narration" id="narration"></div>
    <div class="dialog">
      <div class="who" id="who"></div>
      <div class="line" id="line"></div>
      <div class="choices" id="choices"></div>
      <div class="controls">
        <button class="btn" id="btnSave">存档</button>
        <button class="btn" id="btnLoad">读档</button>
        <button class="btn" id="btnHistory">历史</button>
        <button class="btn" id="btnRestart">重新开始</button>
      </div>
    </div>
  </main>
</div>

<div id="titleScreen" class="hidden">
  <div class="big">SAVE</div>
  <div class="sub">一个关于相遇,和记忆的故事。</div>
  <div class="hint">—— 纯文字 · 相遇 · Demo 0.4 ——</div>
  <div class="title-actions">
    <button class="btn primary" id="btnStart">开始</button>
    <button class="btn" id="btnTitleLoad">读档</button>
  </div>
</div>

<div class="overlay hidden" id="nameOverlay">
  <div class="modal namebox">
    <h2>如果有人叫你,你希望听见什么?</h2>
    <div class="muted">一个普通的名字就好。这个名字,会被记住。</div>
    <input id="nameInput" maxlength="12" placeholder="输入名字">
    <div class="name-actions"><button class="btn primary" id="nameOk">开始</button></div>
  </div>
</div>

<div class="overlay hidden" id="historyOverlay">
  <div class="modal historybox">
    <div class="modalhead"><div><h2>历史记录</h2><div class="muted">回看之前看过的内容</div></div><button class="btn" data-close>返回</button></div>
    <div class="histlist" id="histlist"></div>
  </div>
</div>

<div class="overlay hidden" id="saveOverlay">
  <div class="modal">
    <div class="modalhead"><div><h2>存档</h2><div class="muted">共 8 个存档位 · 覆盖不会影响其他档位</div></div><button class="btn" data-close>返回</button></div>
    <div class="slots" id="saveSlots"></div>
  </div>
</div>

<div class="overlay hidden" id="loadOverlay">
  <div class="modal">
    <div class="modalhead"><div><h2>读档</h2><div class="muted" id="loadInfo">读取会回到保存时的场景。</div></div><button class="btn" data-close>返回</button></div>
    <div class="slots" id="loadSlots"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   引擎 ENGINE —— 通用,与剧本内容无关
   ===================================================================== */

let game = {
  name: "",
  run: 0,           // 周目
  scene: null,      // 当前场景 id
  flags: {},        // 故事状态(随存档回滚)
  nameMystery: true, // 男主是否尚未自报姓名(自报前姓名栏显示「???」)
  // —— meta 记忆层:读档不回滚,只在「重新开始」时清空 ——
  loadCount: 0,     // 本轮读档次数(只增不减)
  saveCount: 0,
  choiceHistory: {},// sceneId -> 已选 label 列表(用于「换选项」检测)
  pending: null     // meta 反应之后要去往的后果场景
};

let history = [];   // 历史记录(已看过的内容,可回看)

const KEY = "SAVE_DEMO_04";
const MAX_SLOTS = 8;

/* ---------- 存储 ---------- */
function getSlots(){ try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ return []; } }
function setSlots(x){ try{ localStorage.setItem(KEY, JSON.stringify(x)); }catch(e){} }
function hasAnySave(){ return getSlots().some(Boolean); }

const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEFAULT_EXPR = "expr_01.png"; // 男主默认表情(半身立绘)
let lineFull = "";
let typeTimer = null;

/* ---------- 场景工具 ---------- */
function cur(){ return scenes[game.scene] || scenes.title; }
function pick(sc, key){ // run>=2 时优先取 key+"2" 变体
  if (game.run >= 2 && sc[key + "2"] != null) return sc[key + "2"];
  return sc[key];
}
function nextOf(sc){ return resolveNext(pick(sc, "next")); }
function resolveNext(n){ // 支持按 flag 条件路由(可嵌套):{ if:"flag", then:"a", else:"b" };或好感分线:{ aff:{...} }
  if (n && typeof n === "object" && "if" in n){
    return game.flags[n.if] ? resolveNext(n.then) : resolveNext(n.else);
  }
  if (n && typeof n === "object" && "aff" in n){
    return routeByAff(n.aff);
  }
  return n || null;
}

/* ---------- 好感结算分线:全0→fallback(闺蜜);唯一最高→该线;平票(2+)→tie(修罗场) ---------- */
function routeByAff(routes){
  const aff = game.flags.aff || {};
  let bestVal = 0, tied = [];
  for (const k in routes){
    if (k === "fallback" || k === "tie") continue;
    const v = aff[k] || 0;
    if (v > bestVal){ bestVal = v; tied = [k]; }
    else if (v === bestVal && v > 0){ tied.push(k); }
  }
  if (bestVal === 0) return routes.fallback;
  if (tied.length >= 2){ // 平票 → 记下「吊了哪几个」,进修罗场
    game.flags.tie = tied.slice();
    game.flags.tieLu   = tied.indexOf("lu")   >= 0;
    game.flags.tieWen  = tied.indexOf("wen")  >= 0;
    game.flags.tieXie  = tied.indexOf("xie")  >= 0;
    game.flags.tieShen = tied.indexOf("shen") >= 0;
    game.flags.tie4    = tied.length >= 4; // 四人全平 → 海王
    return routes.tie;
  }
  return routes[tied[0]];
}
function whoLabel(who){ // 姓名栏:主角显示输入名;男主自报姓名前显示「???」
  if (who === "你") return game.name || "你";
  if (who === "沈砚") return game.nameMystery ? "？？？" : "沈砚";
  return who;
}

/* ---------- 好感度(命定色染字:四个名字常驻,好感越高越亮、越接近各自命定色) ---------- */
const AFF_ROWS = [["shen","沈砚","#8fb6d0"],["lu","陆野","#e59a4a"],["wen","温叙","#a890c8"],["xie","谢舟","#e8c95a"]];
const TIE_NAMES = { lu:"陆野", wen:"温叙", xie:"谢舟", shen:"沈砚" };   // 修罗场二选一/三选一
const TIE_HE    = { lu:"luhe", wen:"wenhe", xie:"xiehe", shen:"whe" };   // 选中直接跳他现有 HE
const AFF_GREY = "#7f8997";          // 好感 0 的灰
const AFF_MIX  = [0, .55, .8, 1];   // 各档混入命定色的比例
const AFF_OP   = [.35, .55, .78, 1];// 各档亮度
function mixHex(a, b, t){ // 在 a、b 两个 #rrggbb 之间按 t(0..1) 混合
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa>>16)&255) + (((pb>>16)&255) - ((pa>>16)&255)) * t);
  const g = Math.round(((pa>>8)&255) + (((pb>>8)&255) - ((pa>>8)&255)) * t);
  const bl = Math.round((pa&255) + ((pb&255) - (pa&255)) * t);
  return "#" + ((r<<16)|(g<<8)|bl).toString(16).padStart(6,"0");
}
function renderAff(){
  const el = document.getElementById("aff"); if (!el) return;
  el.innerHTML = "";
  const aff = game.flags.aff || {};
  AFF_ROWS.forEach(([key, name, color]) => {
    const lv = Math.min(aff[key] || 0, 3);
    const s = document.createElement("span");
    s.textContent = name;
    s.style.color = lv === 0 ? AFF_GREY : mixHex(AFF_GREY, color, AFF_MIX[lv]);
    s.style.opacity = String(AFF_OP[lv]);
    if (lv >= 3) s.classList.add("on");
    el.appendChild(s);
  });
}

/* ---------- meta:换选项检测 ---------- */
function metaSignal(sceneId, label){
  const hist = game.choiceHistory[sceneId] || [];
  if (hist.length === 0) return null;
  if (hist.length >= 3) return "tired";
  const last = hist[hist.length - 1];
  if (last !== label) return "switched";
  return "repeat";
}
function recordChoice(sceneId, label){
  (game.choiceHistory[sceneId] = game.choiceHistory[sceneId] || []).push(label);
}

/* ---------- 渲染 ---------- */
function goto(id){
  if (id === "__pending__"){ id = game.pending || "title"; game.pending = null; }
  game.scene = id;
  const sc = cur();
  if (sc.set){ Object.assign(game.flags, sc.set); }
  if ("nameMystery" in sc) game.nameMystery = sc.nameMystery;
  pushHistory();
  render();
}

/* ---------- 存档快照 ---------- */
function snapshot(){
  const sc = cur();
  return {
    run: game.run, name: game.name, scene: game.scene,
    flags: { ...game.flags }, nameMystery: game.nameMystery,
    chapter: sc.chapter || "", mood: sc.mood || "night",
    note: (sc.line || sc.narration || "").split("\n")[0].slice(0, 18) || "", time: Date.now()
  };
}

function render(){
  const sc = cur();
  // 周目>=2 时优先取「字段名+2」的变体(见 pick)
  const narration = pick(sc, "narration");
  const who = pick(sc, "who");
  const line = pick(sc, "line");
  const next = nextOf(sc);
  let choices = pick(sc, "choices");
  if (!choices && sc.tieChoices && game.flags.tie && game.flags.tie.length){ // 修罗场动态选项:只列吊着的那几个
    choices = game.flags.tie.map(k => ({ label: "选" + (TIE_NAMES[k] || k), next: TIE_HE[k] }));
  }

  // mood/chapter 继承:未声明的场景沿用上一屏(meta 反应场景据此复用到任意月份)
  const mood = sc.mood || game.lastMood || "night";
  game.lastMood = mood;
  const chapter = sc.chapter != null ? sc.chapter : (game.lastChapter || "");
  game.lastChapter = chapter;

  const stage = document.getElementById("stage");
  stage.className = "mood-" + mood;

  document.getElementById("run").textContent = game.run > 0 ? ("周目 " + game.run) : "";
  document.getElementById("chapter").textContent = chapter;

  // 旁白
  const nar = document.getElementById("narration");
  nar.innerHTML = "";
  if (narration){
    const d = document.createElement("div"); d.className = "reveal"; d.textContent = narration;
    nar.appendChild(d);
  }

  // 说话人 + 台词
  const whoEl = document.getElementById("who");
  whoEl.textContent = "";
  whoEl.className = "who";
  if (who){
    whoEl.textContent = whoLabel(who);
    if (who === "你") whoEl.classList.add("self");
  }

  // 立绘:沈砚说话时浮现,无台词淡出;场景可用 expr 字段指定不同表情
  const char = document.getElementById("character");
  const exprSrc = pick(sc, "expr") || (who === "沈砚" ? DEFAULT_EXPR : null);
  if (exprSrc){
    char.src = exprSrc;
    char.classList.remove("hidden");
  } else {
    char.classList.add("hidden");
  }

  typeLine(line || "");

  // 选项 / 继续
  const box = document.getElementById("choices"); box.innerHTML = "";
  if (choices && choices.length){
    choices.forEach(c => {
      const b = document.createElement("button"); b.className = "choice";
      b.textContent = c.label; b.onclick = () => onChoice(c); box.appendChild(b);
    });
  } else if (next){
    const b = document.createElement("button"); b.className = "continue";
    b.textContent = "继续"; b.onclick = advance; box.appendChild(b);
  }

  updateTitleButtons();
  renderAff();
  positionCharacter();
}

// 立绘底部压在对话框上沿下方固定量,盖住图片底部的标注;对话框变高时自动上移
function positionCharacter(){
  const char = document.getElementById("character");
  if (char.classList.contains("hidden")) return;
  const scene = document.querySelector(".scene");
  const dialog = document.querySelector(".dialog");
  const N = 40; // 立绘底部压进对话框的像素量
  const sceneBottom = scene.getBoundingClientRect().bottom;
  const dialogTop = dialog.getBoundingClientRect().top;
  char.style.bottom = Math.round(sceneBottom - dialogTop - N) + "px";
}

function typeLine(text){
  lineFull = text || "";
  const el = document.getElementById("line");
  clearInterval(typeTimer); typeTimer = null;
  el.classList.remove("typing");
  el.textContent = "";
  if (!text) return;
  if (REDUCE_MOTION){ el.textContent = text; return; }
  let i = 0;
  el.classList.add("typing");
  typeTimer = setInterval(() => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length){ finishTyping(); }
  }, 26);
}
function finishTyping(){
  if (typeTimer){ clearInterval(typeTimer); typeTimer = null; }
  document.getElementById("line").classList.remove("typing");
  document.getElementById("line").textContent = lineFull;
}
function advance(){
  if (document.getElementById("line").classList.contains("typing")){ finishTyping(); return; }
  const sc = cur();
  const next = nextOf(sc);
  const choices = pick(sc, "choices");
  if (next && !(choices && choices.length)) goto(next);
}

/* ---------- 选择 ---------- */
function onChoice(c){
  if (c.aff){ game.flags.aff = game.flags.aff || {}; game.flags.aff[c.aff] = (game.flags.aff[c.aff] || 0) + 1; }
  if (c.action){ doAction(c.action); return; }
  if (c.metaNext){
    const sig = metaSignal(game.scene, c.label);
    recordChoice(game.scene, c.label);
    if (sig && c.metaNext[sig]){ game.pending = c.next; goto(c.metaNext[sig]); return; }
  }
  goto(c.next);
}

function doAction(a){
  if (a === "name") openName();
  else if (a === "title") showTitle();
  else if (a === "load") openLoad();
  else if (a === "restart") newRun(game.name);
}

/* ---------- 新周目 ---------- */
function newRun(name){
  game.name = name;
  game.run += 1;
  game.loadCount = 0; game.saveCount = 0;
  game.choiceHistory = {}; game.flags = {}; game.nameMystery = true; game.pending = null;
  game.lastMood = null; game.lastChapter = null;
  history = [];
  closeOverlays();
  goto("s1");
}

/* ---------- 标题屏 ---------- */
function showTitle(){
  document.getElementById("stage").style.display = "none";
  document.getElementById("titleScreen").classList.remove("hidden");
  updateTitleButtons();
}
function showGame(){
  document.getElementById("titleScreen").classList.add("hidden");
  document.getElementById("stage").style.display = "";
}
function updateTitleButtons(){
  document.getElementById("btnTitleLoad").style.display = hasAnySave() ? "" : "none";
}

/* ---------- 弹窗 ---------- */
function closeOverlays(){ document.querySelectorAll(".overlay").forEach(x => x.classList.add("hidden")); }
function openName(){ closeOverlays(); document.getElementById("nameOverlay").classList.remove("hidden");
  setTimeout(() => document.getElementById("nameInput").focus(), 30); }
function confirmName(){
  const v = document.getElementById("nameInput").value.trim(); if (!v) return;
  document.getElementById("nameInput").value = "";
  showGame(); newRun(v);
}

/* ---------- 历史记录 ---------- */
function pushHistory(){
  if (game.scene === "title") return;
  const sc = cur();
  const narration = pick(sc, "narration");
  const who = pick(sc, "who");
  const line = pick(sc, "line");
  if (!narration && !who && !line) return;
  history.push({ chapter: sc.chapter || "", narration: narration || "", who: who || "", line: line || "" });
}
function openHistory(){ closeOverlays(); renderHistory(); document.getElementById("historyOverlay").classList.remove("hidden"); }
function renderHistory(){
  const el = document.getElementById("histlist"); el.innerHTML = "";
  if (history.length === 0){
    el.innerHTML = '<div class="muted" style="padding:24px;text-align:center">还没有任何记录。</div>';
    return;
  }
  let lastChapter = "";
  history.forEach(h => {
    if (h.chapter && h.chapter !== lastChapter){
      lastChapter = h.chapter;
      const ch = document.createElement("div"); ch.className = "hist-ch"; ch.textContent = h.chapter; el.appendChild(ch);
    }
    const item = document.createElement("div"); item.className = "hist-item";
    if (h.narration){
      const n = document.createElement("div"); n.className = "hist-nar"; n.textContent = h.narration; item.appendChild(n);
    }
    if (h.who || h.line){
      if (h.who){ const w = document.createElement("div"); w.className = "hist-who" + (h.who === "你" ? " self" : ""); w.textContent = h.who; item.appendChild(w); }
      if (h.line){ const l = document.createElement("div"); l.className = "hist-line"; l.textContent = h.line; item.appendChild(l); }
    }
    el.appendChild(item);
  });
  el.scrollTop = el.scrollHeight;
}
/* ---------- 存档 / 读档 ---------- */
function openSave(){ closeOverlays(); renderSlots("saveSlots", false); document.getElementById("saveOverlay").classList.remove("hidden"); }
function openLoad(){
  closeOverlays(); renderSlots("loadSlots", true);
  document.getElementById("loadInfo").textContent = "读取会回到保存时的场景。";
  document.getElementById("loadOverlay").classList.remove("hidden");
}
function thumbGrad(mood){
  return {
    rain:"linear-gradient(135deg,#0c1620,#27425c)", night:"linear-gradient(135deg,#12100c,#3a2c1c)",
    store:"linear-gradient(135deg,#141a20,#263140)", glitch:"linear-gradient(135deg,#120c14,#4a2430)",
    warmrain:"linear-gradient(135deg,#120e0c,#3a2c1c)"
  }[mood] || "linear-gradient(135deg,#0c1118,#222a35)";
}
function fmtTime(t){ const d = new Date(t); return d.toLocaleString(); }
function renderSlots(id, isLoad){
  const el = document.getElementById(id); el.innerHTML = "";
  const slots = getSlots();
  for (let i = 0; i < MAX_SLOTS; i++){
    const d = slots[i];
    const wrap = document.createElement("div"); wrap.className = "slot" + (d ? "" : " empty");
    const thumb = document.createElement("div"); thumb.className = "thumb";
    thumb.style.background = d ? thumbGrad(d.mood) : "#171c24";
    const info = document.createElement("div");
    info.innerHTML = "<strong>存档 " + String(i + 1).padStart(2, "0") + "</strong>" +
      (d ? "<small>" + (d.chapter || "—") + "<br>周目 " + d.run + " · " + fmtTime(d.time) + "<br>" + (d.note || "") + "</small>"
         : "<small>空存档位</small>");
    const actions = document.createElement("div");
    if (isLoad && d){ const b = document.createElement("button"); b.textContent = "读取"; b.onclick = () => loadSlot(i); actions.appendChild(b); }
    if (!isLoad){ const b = document.createElement("button"); b.textContent = d ? "覆盖" : "保存"; b.onclick = () => saveSlot(i); actions.appendChild(b); }
    wrap.append(thumb, info, actions); el.appendChild(wrap);
  }
}
function saveSlot(i){ const s = getSlots(); s[i] = snapshot(); setSlots(s); renderSlots("saveSlots", false); }
function loadSlot(i){
  const d = getSlots()[i]; if (!d) return;
  game.run = d.run; game.name = d.name; game.scene = d.scene;
  game.flags = { ...(d.flags || {}) };
  game.nameMystery = !!d.nameMystery;
  game.pending = null;
  game.lastMood = d.mood || null; game.lastChapter = d.chapter != null ? d.chapter : null;
  game.loadCount += 1;
  closeOverlays();
  render();
}
/* ---------- 事件绑定 ---------- */
document.getElementById("btnSave").onclick = openSave;
document.getElementById("btnLoad").onclick = openLoad;
document.getElementById("btnHistory").onclick = openHistory;
document.getElementById("btnRestart").onclick = openName;
document.getElementById("btnStart").onclick = () => { showGame(); openName(); };
document.getElementById("btnTitleLoad").onclick = () => { showGame(); openLoad(); };
document.getElementById("nameOk").onclick = confirmName;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeOverlays);
// 点击对话框推进;键盘推进
document.querySelector(".dialog").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") return;
  advance();
});
window.addEventListener("resize", positionCharacter);
window.addEventListener("keydown", e => {
  const nameOpen = !document.getElementById("nameOverlay").classList.contains("hidden");
  if (nameOpen){ if (e.key === "Enter") confirmName(); return; }
  const overlayOpen = document.querySelector(".overlay:not(.hidden)");
  if (overlayOpen){ if (e.key === "Escape") closeOverlays(); return; }
  if (!document.getElementById("titleScreen").classList.contains("hidden")) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === "BUTTON") return; // 让按钮原生的 Enter/Space 生效,避免重复推进
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); advance(); }
});
