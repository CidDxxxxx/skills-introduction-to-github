<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <div class="shell">
    <div class="window">
      <div class="top"><b>《SAVE》</b><span id="run">DEMO 0.3 · 周目 1</span></div>
      <div class="scene">
        <div class="bgimage" id="bgimage"></div>
        <div class="chapter" id="chapter"></div>
        <div class="narration" id="narration"></div>
        <img class="character hidden" id="character" alt="沈砚">
        <div class="dialog">
          <div class="who" id="who"></div>
          <div class="line" id="line"></div>
          <div class="choices" id="choices"></div>
          <div class="controls">
            <button class="btn" onclick="openSave()">存档</button>
            <button class="btn" onclick="openLoad()">读档</button>
            <button class="btn" onclick="newRun()">重新开始</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="nameOverlay">
  <div class="modal namebox">
    <h2>先告诉我你的名字</h2>
    <div class="muted">一个普通的名字就好。</div>
    <input id="nameInput" maxlength="12" placeholder="输入名字">
    <div class="name-actions"><button class="btn primary" onclick="confirmName()">开始</button></div>
  </div>
</div>

<div class="overlay hidden" id="saveOverlay">
 <div class="modal">
  <div class="modalhead"><div><h2>存档</h2><div class="muted">共 8 个存档位 · 覆盖不会影响其他档位</div></div><button class="btn" onclick="closeOverlays()">返回</button></div>
  <div class="slots" id="saveSlots"></div>
 </div>
</div>

<div class="overlay hidden" id="loadOverlay">
 <div class="modal">
  <div class="modalhead"><div><h2>读档</h2><div class="muted">读取会回到保存时的场景。</div></div><button class="btn" onclick="closeOverlays()">返回</button></div>
  <div class="slots" id="loadSlots"></div>
 </div>
</div>

 sc.choices.forEach(([label,next])=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>{game.scene=next;game.playCount++;render()};box.appendChild(b)});

function closeOverlays(){document.querySelectorAll(".overlay").forEach(x=>x.classList.add("hidden"))}
function openName(){closeOverlays();document.getElementById("nameOverlay").classList.remove("hidden");setTimeout(()=>document.getElementById("nameInput").focus(),30)}
function confirmName(){
 const v=document.getElementById("nameInput").value.trim(); if(!v)return;
 game.name=v;game.run=(game.run||0)+1;game.scene=0;game.loadCount=0;game.playCount=0;closeOverlays();render();
}
function newRun(){openName()}
function openSave(){closeOverlays();renderSlots("saveSlots",false);document.getElementById("saveOverlay").classList.remove("hidden")}
function openLoad(){closeOverlays();renderSlots("loadSlots",true);document.getElementById("loadOverlay").classList.remove("hidden")}
function renderSlots(id,isLoad){
 const el=document.getElementById(id);el.innerHTML="";const slots=getSlots();
 for(let i=0;i<MAX;i++){
  const d=slots[i];const wrap=document.createElement("div");wrap.className="slot"+(!d?" empty":"");
  const thumb=document.createElement("img");thumb.className="thumb";thumb.src=d?(d.chapter.includes("放学")?BG["bg_city.jpg"]:d.chapter.includes("END")?BG["bg_room.jpg"]:BG["bg_campus.jpg"]):BG["bg_room.jpg"];
  const info=document.createElement("div");
  info.innerHTML=`<strong>存档 ${String(i+1).padStart(2,"0")}</strong>${d?`<small>${d.chapter}<br>周目 ${d.run} · ${d.time}<br>${d.note}</small>`:`<small>空存档位</small>`}`;
  const actions=document.createElement("div");
  if(isLoad && d){const b=document.createElement("button");b.textContent="读取";b.onclick=()=>loadSlot(i);actions.appendChild(b)}
  if(!isLoad){const b=document.createElement("button");b.textContent=d?"覆盖":"保存";b.onclick=()=>saveSlot(i);actions.appendChild(b)}
  wrap.append(thumb,info,actions);el.appendChild(wrap);
 }
}
function saveSlot(i){const slots=getSlots();slots[i]=slotData();setSlots(slots);renderSlots("saveSlots",false)}
function loadSlot(i){
 const d=getSlots()[i];if(!d)return;
 game={...game,...d,loadCount:(d.loadCount||0)+1};closeOverlays();render();
}
window.addEventListener("keydown",e=>{if(e.key==="Enter"&&!document.getElementById("nameOverlay").classList.contains("hidden"))confirmName()});
openName();
</script>

<script>
window.addEventListener("error", function(e){
  const box=document.getElementById("line");
  if(box && !box.textContent){
    box.textContent="游戏加载遇到了一点小问题，请刷新页面重试。";
  }
});
</script>
